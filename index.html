<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading…</title>
  <link rel="icon" href="photos/logo.png" type="image/png" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- Navbar shell — content injected by script.js -->
  <nav class="navbar" id="navbar">
    <div class="nav-inner">
      <a href="#hero" class="logo" id="nav-logo">
        <img class="logo-icon" src="photos/logo.png" alt="I Discepoli" />
        <span class="logo-text" id="nav-team-name"></span>
      </a>
      <button class="hamburger" id="hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav-links" id="nav-links"></ul>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero" id="hero">
    <div class="hero-bg"></div>
    <div class="hero-content">
      <p class="hero-eyebrow" id="hero-eyebrow"></p>
      <h1 class="hero-title" id="hero-title"></h1>
      <p class="hero-subtitle" id="hero-subtitle"><span id="hero-dynamic-prefix"></span><span id="hero-dynamic-word"></span><span class="typewriter-cursor">|</span></p>
      <div class="hero-actions" id="hero-actions"></div>
    </div>
    <a href="#values" class="scroll-indicator" aria-label="Scorri">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 5v14M5 12l7 7 7-7"/>
      </svg>
    </a>
  </section>

  <!-- Values -->
  <section class="section" id="values">
    <div class="container">
      <div class="section-header" id="values-header"></div>
      <div class="values-grid" id="values-grid"></div>
    </div>
  </section>

  <!-- Team -->
  <section class="section section-dark" id="team">
    <div class="container">
      <div class="section-header" id="team-header"></div>
      <div class="team-grid" id="team-grid"></div>
    </div>
  </section>

  <!-- Gallery -->
  <section class="section" id="gallery">
    <div class="container">
      <div class="section-header" id="gallery-header"></div>
      <div class="gallery-grid" id="gallery-grid"></div>
    </div>
  </section>

  <!-- Roadmap -->
  <section class="section section-dark" id="roadmap">
    <div class="container">
      <div class="section-header" id="roadmap-header"></div>
      <div class="roadmap-tabs" id="roadmap-tabs"></div>
      <div id="roadmap-panels"></div>
    </div>
  </section>

  <!-- Merch -->
  <section class="section" id="merch">
    <div class="container">
      <div class="section-header" id="merch-header"></div>
      <div class="merch-grid" id="merch-grid"></div>
    </div>
  </section>

  <!-- Best Fans -->
  <section class="section" id="fans">
    <div class="container">
      <div class="section-header" id="fans-header"></div>
      <div class="team-grid" id="fans-grid"></div>
    </div>
  </section>

  <!-- Sponsors -->
  <section class="section" id="sponsors">
    <div class="container">
      <div class="section-header" id="sponsors-header"></div>
      <div class="sponsors-grid" id="sponsors-grid"></div>
    </div>
  </section>

  <!-- Holy Board -->
  <section class="section" id="board">
    <div class="container">
      <div class="section-header" id="board-header"></div>
      <div class="board-grid" id="board-grid"></div>
    </div>
  </section>

  <!-- Contacts -->
  <section class="section section-dark" id="contacts">
    <div class="container">
      <div class="section-header" id="contacts-header"></div>
      <div class="contact-info" id="contact-info"></div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-inner">
        <p class="footer-logo" id="footer-logo"></p>
        <p class="footer-copy" id="footer-copy"></p>
        <div class="footer-links" id="footer-links"></div>
      </div>
    </div>
  </footer>

  <!-- Lightbox -->
  <div class="lightbox-overlay" id="lightbox" role="dialog" aria-modal="true" aria-label="Immagine ingrandita">
    <button class="lightbox-close" id="lightbox-close" aria-label="Chiudi">✕</button>
    <img class="lightbox-img" id="lightbox-img" src="" alt="" />
  </div>

  <!-- Order Modal -->
  <div class="modal-overlay" id="order-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal">
      <button class="modal-close" id="modal-close" aria-label="Chiudi">✕</button>

      <div class="modal-images" id="modal-images">
        <img class="modal-img-main" id="modal-img-main" src="" alt="" />
        <div class="modal-img-thumbs" id="modal-img-thumbs"></div>
      </div>

      <p class="modal-eyebrow" id="modal-eyebrow"></p>
      <h3 class="modal-title" id="modal-title"></h3>

      <!-- Step 1: Form -->
      <div id="modal-step-1">
        <form class="modal-form" id="order-form">
          <input type="hidden" name="product"   id="order-product" />
          <input type="hidden" name="_template" value="table" />
          <input type="hidden" name="_subject"  id="order-subject" />
          <input type="hidden" name="_replyto"  id="order-replyto" />
          <input type="hidden" name="_captcha"  value="false" />
          <div class="form-group">
            <label for="order-name" id="label-order-name"></label>
            <input type="text" id="order-name" name="name" required />
          </div>
          <div class="form-group">
            <label for="order-email" id="label-order-email"></label>
            <input type="email" id="order-email" name="email" />
          </div>
          <div class="form-group">
            <label for="order-phone" id="label-order-phone"></label>
            <input type="tel" id="order-phone" name="phone" required />
          </div>
          <div class="form-group" id="size-group">
            <label for="order-size" id="label-order-size"></label>
            <select id="order-size" name="size"></select>
          </div>
          <div class="form-group">
            <label for="order-qty" id="label-order-qty"></label>
            <input type="number" id="order-qty" name="quantity" min="1" value="1" required />
          </div>
          <div class="form-group">
            <label for="order-msg" id="label-order-msg"></label>
            <textarea id="order-msg" name="message" rows="3"></textarea>
          </div>
          <div class="form-group" id="payment-group">
            <label id="label-order-payment"></label>
            <div class="payment-options">
              <label class="payment-option">
                <input type="radio" name="payment_method" value="paypal" required />
                <span id="label-paypal"></span>
              </label>
              <label class="payment-option">
                <input type="radio" name="payment_method" value="iban" />
                <span id="label-iban"></span>
              </label>
            </div>
          </div>
          <button type="button" class="btn btn-primary" id="order-next"></button>
        </form>
      </div>

      <!-- Step 2: Summary + submit -->
      <div id="modal-step-2" style="display:none">
        <div class="order-summary" id="order-summary"></div>
        <div class="payment-instructions" id="payment-instructions"></div>
        <div class="modal-step2-actions">
          <button type="button" class="btn btn-outline" id="order-back"></button>
          <button type="button" class="btn btn-primary" id="order-submit"></button>
        </div>
        <p class="form-feedback" id="order-feedback"></p>
      </div>

    </div>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
